stages:
  - test
  - build
  - deploy

test-job:
  stage: test
  script:
    - echo "Running unit tests... This will take about 60 seconds."
    - echo "Code coverage is 90%"

build-job:
  stage: build
  script:
    - docker build --network=host -t diary-backend .

deploy-job:
  stage: deploy
  environment: production
  script:
    - docker compose up -d
