spring.application.name=diaryBackend

#spring.datasource.url=jdbc:postgresql://localhost:5432/Diary
#spring.datasource.username=postgres
#spring.datasource.password=root

spring.datasource.url=jdbc:postgresql://80.93.62.33:5432/diary
spring.datasource.username=postgres
spring.datasource.password=root

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database=postgresql
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

file.storage.server-url=http://80.93.62.33
file.storage.upload-url=${file.storage.server-url}/upload
file.storage.access-url=${file.storage.server-url}/files
file.storage.delete-url=${file.storage.server-url}/delete

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.temp.path=./temp-storage
